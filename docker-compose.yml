services:
  web:
    build: .
    image: allergen-review:latest
    container_name: allergen-review
    ports:
      - "8000:8000"
    volumes:
      - allergen-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  allergen-data:
